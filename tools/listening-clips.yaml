  # ---- VOA Let's Learn English: whole dialogues, video, official transcript with speakers
  - id: lle-06-where-is-the-gym
    title: "Where Is the Gym?"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_06.mp4
    script_file: voa_lle/l1_06.txt
    tags: [prepositions, places]
    summary: "Анна ищет спортзал и спрашивает дорогу. Предлоги места — across from, next to, behind."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-6-where-is-the-gym/3225958.html"}
  - id: lle-07-what-are-you-doing
    title: "What Are You Doing?"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_07.mp4
    script_file: voa_lle/l1_07.txt
    tags: [present-continuous]
    summary: "Коллеги Анны заняты своими делами — что каждый делает прямо сейчас."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-7-what-are-you-doing/3240468.html"}
  - id: lle-11-my-neighborhood
    title: "This Is My Neighborhood"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_11.mp4
    script_file: voa_lle/l1_11.txt
    tags: [prepositions, places]
    summary: "Анна ищет библиотеку, почту и банк: on the corner, far, across from, behind."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-11-this-is-my-neighborhood/3293986.html"}
  - id: lle-14-how-about-this
    title: "How About This?"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_14.mp4
    script_file: voa_lle/l1_14.txt
    tags: [clothes]
    summary: "Анна и Пит собираются в театр и выбирают одежду: casual или formal, размеры, «подходит / не подходит»."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-14-how-about-this/3323771.html"}
  - id: lle-15-people-watching
    title: "I Love People-Watching!"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_15.mp4
    script_file: voa_lle/l1_15.txt
    tags: [appearance, present-simple-vs-continuous]
    summary: "Анна и Эшли разглядывают прохожих: внешность, волосы, рост — и «Is she wearing a blue sweater today?»"
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-15-i-love-people-watching/3343720.html"}
  - id: lle-18-she-always-does-that
    title: "She Always Does That!"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_18.mp4
    script_file: voa_lle/l1_18.txt
    tags: [adverbs-of-frequency, feelings]
    summary: "Анна читает новости и рассказывает истории в эфире. Наречия частоты — always, rarely, often, never."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-18-she-always-does-that/3357748.html"}
  - id: lle-19-when-do-you-start
    title: "When Do You Start?"
    level: A2
    crop_bottom: 0.27
    file: voa_lle/l1_19.mp4
    script_file: voa_lle/l1_19.txt
    tags: [present-simple-vs-continuous]
    summary: "«I always ride the Metro… but today I am walking» — обычное против сегодняшнего; хорошие и плохие новости на работе."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-lesson-19-when-do-you-start/3357760.html"}
  - id: lle-2-24-super-suit
    title: "The Superhero Convention"
    level: B1
    crop_bottom: 0.27
    file: voa_lle/l2_24.mp4
    script_file: voa_lle/l2_24.txt
    tags: [clothes]
    summary: "Анна собирается на фестиваль супергероев; после удара молнии её волосы и одежда изменились — «This is my super suit!». Уровень B1."
    source: {<<: *voa, url: "https://learningenglish.voanews.com/a/lets-learn-english-level-2-lesson-24/4307612.html"}

