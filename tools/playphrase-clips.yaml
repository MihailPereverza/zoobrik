      growing*) почти всегда в **Continuous**.'
    dictation: '**it''s getting** звучит как одно слово — *itsgetting*, **t** в *getting* мягкое, почти [d]. **Anyway** в
      начале — «ладно, в общем».'
    choice:
      question: Что сказал герой?
      wrong:
      - Anyway, it gets late.
