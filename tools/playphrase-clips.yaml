  67114d3314e7a06655d6ca78:
    translation: Что ты здесь делаешь?
    gap: 'Вопрос в **Present Continuous**: вопросительное слово + **are** + подлежащее + **-ing**. Спрашивают, что человек
      делает **прямо сейчас**, а не чем занимается вообще (*What do you do?* — кем работаешь).'
    dictation: '**What are you** сливается — *Whatcha* / *What''re ya*, **are** почти исчезает до [ə]. Ударение на **doing**
