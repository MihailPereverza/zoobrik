    dictation: '**make me** звучит слитно, *They* — слабое [ðeɪ]. В конце чётко: **look fat**.'
    choice:
      wrong:
      - They make me look thin.
      - They make me feel fat.
      explanation: Героиня жалуется, что в этой одежде она **выглядит толстой** — *look fat*, а не «чувствует себя» (*feel*)
        и не «худой» (*thin*).
