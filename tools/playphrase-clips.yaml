  671a2eb13461df05f7264d35:
    translation: Берегись, внизу!
    gap: '**below** — внизу, ниже по месту: так кричат сверху тем, кто стоит внизу. Противоположное — **above**.'
    dictation: '**Look out** сливается в одно: [lʊkaʊt] — *k* переходит прямо в *out*. Восклицание: «Берегись!»'
    choice:
      question: Что крикнул герой?
      wrong:
      - Look out above!
      - Look down below!
      explanation: Герой кричит тем, кто **внизу**, — *below*. *Look out* — «берегись», а не «посмотри вниз».
